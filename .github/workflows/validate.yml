name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Privacy validation must inspect the public checked-out ref's full
          # ancestry, not only the shallow checkout supplied by default. On a
          # pull request, validate the contributor's head rather than GitHub's
          # synthetic merge commit, whose generated identity is not controlled
          # by this repository.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Check commit identity and tracked-content privacy
        run: python3 scripts/privacy_check.py --history --tracked
      - name: Validate and render
        run: python3 scripts/build.py
      - name: Check evidence review schedule
        run: python3 scripts/refresh.py
